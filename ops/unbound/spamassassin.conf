# /etc/unbound/unbound.conf.d/spamassassin.conf
#
# SpamAssassin 전용 로컬 캐싱 리졸버. 127.0.0.1@5353로만 열어서
# 시스템 전체 DNS(/etc/resolv.conf, systemd-resolved)는 건드리지 않음.
# 공용 DNS(OpenDNS)로 조회하면 Spamhaus가 DNSBL 쿼리를 거부해서
# RCVD_IN_ZEN_BLOCKED_OPENDNS 같은 룰이 항상 붙던 문제 우회.

server:
    interface: 127.0.0.1@5353
    access-control: 127.0.0.1/32 allow
    do-ip6: no
    do-not-query-localhost: no
