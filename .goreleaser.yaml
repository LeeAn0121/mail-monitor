version: 2

project_name: mail-monitor

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"
    - go mod tidy

builds:
  - id: mail-monitor
    main: .
    binary: mail-monitor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: mail-monitor
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: mail-monitor-deb
    package_name: mail-monitor
    # No version in the filename, unlike the archives above — install.sh
    # downloads this via GitHub's releases/latest/download/<name> redirect,
    # which needs a name that's stable release to release. That path skips
    # the api.github.com/releases/latest call entirely, so it isn't subject
    # to that endpoint's (much stricter) unauthenticated rate limit.
    file_name_template: "{{ .ProjectName }}_linux_{{ .Arch }}"
    vendor: koolsign
    homepage: https://LeeAn0121.github.io/mail-monitor/
    maintainer: LeeAn0121 <koolsignpad@gmail.com>
    description: >-
      Real-time TUI dashboard for monitoring Postfix/Dovecot mail server logs
      (logins, delivery, sent, bounces, rejects).
    license: MIT
    formats:
      - deb
    section: utils
    priority: optional
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/mail-monitor/README.md
      - src: ./ops/systemd/mail-monitor.service
        dst: /lib/systemd/system/mail-monitor.service
    scripts:
      postinstall: ./ops/systemd/postinstall.sh
      preremove: ./ops/systemd/preremove.sh

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: LeeAn0121
    name: mail-monitor

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
